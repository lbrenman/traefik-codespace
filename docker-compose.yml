##############################################################
# Traefik Dev Environment — docker-compose.yml
#
# Routing strategy:
#   API services  → PathPrefix + strip-prefix + API key auth
#   Grafana       → PathPrefix /grafana, Grafana handles subpath internally
#   Portainer     → Exposed directly on port 9000 (subpath not supported)
#   Traefik dash  → Port 8080 (built-in)
#
# In GitHub Codespaces, each forwarded port gets its own
# HTTPS URL automatically — no TLS config needed.
##############################################################

networks:
  traefik-net:
    name: traefik-net

volumes:
  traefik-logs:
  portainer-data:
  prometheus-data:
  grafana-data:

services:

  # ============================================================
  # TRAEFIK — Reverse proxy + dashboard on :8080
  # ============================================================
  traefik:
    image: traefik:v3.6
    container_name: traefik
    restart: unless-stopped
    ports:
      - "80:80"
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./config/traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./config/traefik/dynamic:/etc/traefik/dynamic:ro
      - traefik-logs:/var/log/traefik
    networks:
      - traefik-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dashboard.rule=PathPrefix(`/dashboard`) || PathPrefix(`/api`)"
      - "traefik.http.routers.dashboard.service=api@internal"
      - "traefik.http.routers.dashboard.middlewares=dashboard-auth@file"

  # ============================================================
  # AUTH SERVICE — internal only, never exposed via Traefik
  # ============================================================
  auth-service:
    build:
      context: ./services/auth-service
      dockerfile: Dockerfile
    container_name: auth-service
    restart: unless-stopped
    env_file: .env
    environment:
      - PORT=9000
    networks:
      - traefik-net

  # ============================================================
  # WHOAMI — API key protected, path-based
  # ============================================================
  whoami:
    image: traefik/whoami:latest
    container_name: whoami
    restart: unless-stopped
    networks:
      - traefik-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.whoami.rule=PathPrefix(`/whoami`)"
      - "traefik.http.routers.whoami.entrypoints=web"
      - "traefik.http.routers.whoami.middlewares=auth-whoami@file,strip-prefix-whoami@file"
      - "traefik.http.services.whoami.loadbalancer.server.port=80"

  # ============================================================
  # API 1 — Products, API key protected, path-based
  # ============================================================
  api1:
    build:
      context: ./services/api1
      dockerfile: Dockerfile
    container_name: api1
    restart: unless-stopped
    environment:
      - SERVICE_NAME=API Service 1 (Products)
      - PORT=3001
    networks:
      - traefik-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api1.rule=PathPrefix(`/api1`)"
      - "traefik.http.routers.api1.entrypoints=web"
      - "traefik.http.routers.api1.middlewares=auth-api1@file,rate-limit@file,strip-prefix-api1@file"
      - "traefik.http.services.api1.loadbalancer.server.port=3001"

  # ============================================================
  # API 2 — Users, API key protected, path-based
  # ============================================================
  api2:
    build:
      context: ./services/api2
      dockerfile: Dockerfile
    container_name: api2
    restart: unless-stopped
    environment:
      - SERVICE_NAME=API Service 2 (Users)
      - PORT=3002
    networks:
      - traefik-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api2.rule=PathPrefix(`/api2`)"
      - "traefik.http.routers.api2.entrypoints=web"
      - "traefik.http.routers.api2.middlewares=auth-api2@file,rate-limit@file,strip-prefix-api2@file"
      - "traefik.http.services.api2.loadbalancer.server.port=3002"

  # ============================================================
  # WEB — Static frontend, open, path-based
  # ============================================================
  web:
    build:
      context: ./services/web
      dockerfile: Dockerfile
    container_name: web
    restart: unless-stopped
    networks:
      - traefik-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.web.rule=PathPrefix(`/web`)"
      - "traefik.http.routers.web.entrypoints=web"
      - "traefik.http.routers.web.middlewares=strip-prefix-web@file"
      - "traefik.http.services.web.loadbalancer.server.port=80"

  # ============================================================
  # PORTAINER — Docker UI, exposed directly on port 9000
  #
  # Portainer CE does not reliably support subpath routing.
  # Access via Codespaces port 9000 URL directly.
  # In Codespaces: open the Ports tab and click the port 9000 URL.
  # ============================================================
  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer
    restart: unless-stopped
    command: -H unix:///var/run/docker.sock
    ports:
      - "9000:9000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - portainer-data:/data
    networks:
      - traefik-net

  # ============================================================
  # PROMETHEUS — internal only, feeds Grafana
  # ============================================================
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    volumes:
      - ./config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - traefik-net

  # ============================================================
  # GRAFANA — Metrics UI at /grafana via Traefik
  #
  # GF_SERVER_ROOT_URL + GF_SERVER_SERVE_FROM_SUB_PATH tell Grafana
  # to serve itself at /grafana and generate correct asset URLs.
  # Do NOT use strip-prefix — Grafana must receive requests with
  # the /grafana prefix intact so it can handle the subpath itself.
  # ============================================================
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    environment:
      - GF_SERVER_ROOT_URL=%(protocol)s://%(domain)s/grafana
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_PATHS_PROVISIONING=/etc/grafana/provisioning
    volumes:
      - grafana-data:/var/lib/grafana
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - traefik-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.grafana.rule=PathPrefix(`/grafana`)"
      - "traefik.http.routers.grafana.entrypoints=web"
      # No strip-prefix middleware — Grafana handles /grafana subpath internally
      - "traefik.http.services.grafana.loadbalancer.server.port=3000"
