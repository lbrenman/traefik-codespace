##############################################################
# Traefik Dev Environment — docker-compose.yml
#
# Security model:
#   API services use per-service API key auth via ForwardAuth.
#   UI services (Portainer, Grafana) use their own built-in auth.
#   HTTPS is provided automatically by GitHub Codespaces.
#
# Services:
#   traefik       — Reverse proxy + router (dashboard at :8080)
#   auth-service  — ForwardAuth API key validator (internal only)
#   whoami        — Echo service          → /whoami/   (API key)
#   api1          — Products REST API     → /api1/     (API key)
#   api2          — Users REST API        → /api2/     (API key)
#   web           — Static frontend       → /web       (open)
#   portainer     — Docker UI             → /portainer/ (own auth)
#   prometheus    — Metrics scraper       (internal only)
#   grafana       — Dashboards UI         → /grafana/  (own auth)
##############################################################

networks:
  traefik-net:
    name: traefik-net

volumes:
  traefik-logs:
  portainer-data:
  prometheus-data:
  grafana-data:

services:

  # ============================================================
  # TRAEFIK — Reverse proxy
  # ============================================================
  traefik:
    image: traefik:v3.1
    container_name: traefik
    restart: unless-stopped
    ports:
      - "80:80"
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./config/traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./config/traefik/dynamic:/etc/traefik/dynamic:ro
      - traefik-logs:/var/log/traefik
    networks:
      - traefik-net
    labels:
      - "traefik.enable=true"
      # Dashboard: match any host (works in Codespaces and localhost)
      - "traefik.http.routers.dashboard.rule=PathPrefix(`/dashboard`) || PathPrefix(`/api`)"
      - "traefik.http.routers.dashboard.service=api@internal"
      - "traefik.http.routers.dashboard.middlewares=dashboard-auth@file"

  # ============================================================
  # AUTH SERVICE — ForwardAuth API key validator (internal only)
  # ============================================================
  auth-service:
    build:
      context: ./services/auth-service
      dockerfile: Dockerfile
    container_name: auth-service
    restart: unless-stopped
    env_file: .env
    environment:
      - PORT=9000
    networks:
      - traefik-net

  # ============================================================
  # WHOAMI — Echo/diagnostic service (API key protected)
  # ============================================================
  whoami:
    image: traefik/whoami:latest
    container_name: whoami
    restart: unless-stopped
    networks:
      - traefik-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.whoami.rule=PathPrefix(`/whoami`)"
      - "traefik.http.routers.whoami.entrypoints=web"
      - "traefik.http.routers.whoami.middlewares=auth-whoami@file,strip-prefix-whoami@file"
      - "traefik.http.services.whoami.loadbalancer.server.port=80"

  # ============================================================
  # API SERVICE 1 — Products API (API key protected)
  # ============================================================
  api1:
    build:
      context: ./services/api1
      dockerfile: Dockerfile
    container_name: api1
    restart: unless-stopped
    environment:
      - SERVICE_NAME=API Service 1 (Products)
      - PORT=3001
    networks:
      - traefik-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api1.rule=PathPrefix(`/api1`)"
      - "traefik.http.routers.api1.entrypoints=web"
      - "traefik.http.routers.api1.middlewares=auth-api1@file,rate-limit@file,strip-prefix-api1@file"
      - "traefik.http.services.api1.loadbalancer.server.port=3001"

  # ============================================================
  # API SERVICE 2 — Users API (API key protected)
  # ============================================================
  api2:
    build:
      context: ./services/api2
      dockerfile: Dockerfile
    container_name: api2
    restart: unless-stopped
    environment:
      - SERVICE_NAME=API Service 2 (Users)
      - PORT=3002
    networks:
      - traefik-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api2.rule=PathPrefix(`/api2`)"
      - "traefik.http.routers.api2.entrypoints=web"
      - "traefik.http.routers.api2.middlewares=auth-api2@file,rate-limit@file,strip-prefix-api2@file"
      - "traefik.http.services.api2.loadbalancer.server.port=3002"

  # ============================================================
  # WEB APP — Static frontend (no auth)
  # ============================================================
  web:
    build:
      context: ./services/web
      dockerfile: Dockerfile
    container_name: web
    restart: unless-stopped
    networks:
      - traefik-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.web.rule=PathPrefix(`/web`)"
      - "traefik.http.routers.web.entrypoints=web"
      - "traefik.http.routers.web.middlewares=strip-prefix-web@file"
      - "traefik.http.services.web.loadbalancer.server.port=80"

  # ============================================================
  # PORTAINER — Docker management UI
  # ============================================================
  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - portainer-data:/data
    networks:
      - traefik-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.portainer.rule=PathPrefix(`/portainer`)"
      - "traefik.http.routers.portainer.entrypoints=web"
      # Chain: redirect bare /portainer → /portainer/ then strip prefix
      - "traefik.http.routers.portainer.middlewares=redirect-portainer@file,strip-prefix-portainer@file"
      - "traefik.http.services.portainer.loadbalancer.server.port=9000"

  # ============================================================
  # PROMETHEUS — Metrics scraper (internal only)
  # ============================================================
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    volumes:
      - ./config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - traefik-net

  # ============================================================
  # GRAFANA — Metrics dashboard UI
  # ============================================================
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    environment:
      - GF_SERVER_ROOT_URL=%(protocol)s://%(domain)s/grafana/
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_PATHS_PROVISIONING=/etc/grafana/provisioning
    volumes:
      - grafana-data:/var/lib/grafana
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - traefik-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.grafana.rule=PathPrefix(`/grafana`)"
      - "traefik.http.routers.grafana.entrypoints=web"
      # Chain: redirect bare /grafana → /grafana/ then strip prefix
      - "traefik.http.routers.grafana.middlewares=redirect-grafana@file,strip-prefix-grafana@file"
      - "traefik.http.services.grafana.loadbalancer.server.port=3000"
