# traefik.yml — Static Configuration
# Note: HTTPS is handled automatically by GitHub Codespaces for all forwarded ports.

api:
  dashboard: true
  insecure: true
  debug: true

entryPoints:
  web:
    address: ":80"

providers:
  docker:
    endpoint: "unix:///var/run/docker.sock"
    exposedByDefault: false
    # NOTE: No 'network' constraint here — Traefik v3 can silently drop
    # container discovery when this is set. Traefik will route to the
    # correct container IP automatically via the Docker socket.
  file:
    directory: /etc/traefik/dynamic
    watch: true

log:
  level: DEBUG

accessLog:
  filePath: "/var/log/traefik/access.log"
  format: common
