# traefik.yml — Static Configuration
# Note: HTTPS is handled automatically by GitHub Codespaces for all forwarded ports.
# Traefik only needs to handle plain HTTP internally.

api:
  dashboard: true
  insecure: true
  debug: true

entryPoints:
  web:
    address: ":80"

providers:
  docker:
    endpoint: "unix:///var/run/docker.sock"
    exposedByDefault: false
    network: "traefik-net"
  file:
    directory: /etc/traefik/dynamic
    watch: true

log:
  level: DEBUG

accessLog:
  filePath: "/var/log/traefik/access.log"
  format: common
