# config/traefik/dynamic/middlewares.yml
# Hot-reloaded by Traefik when this file changes.

http:
  middlewares:

    # =========================================================================
    # API KEY AUTH via ForwardAuth
    # Each service has its own middleware pointing to a different ?service= param
    # =========================================================================
    auth-api1:
      forwardAuth:
        address: "http://auth-service:9000/auth?service=api1"
        authResponseHeaders:
          - "X-Authenticated-Service"
        authRequestHeaders:
          - "X-Api-Key"

    auth-api2:
      forwardAuth:
        address: "http://auth-service:9000/auth?service=api2"
        authResponseHeaders:
          - "X-Authenticated-Service"
        authRequestHeaders:
          - "X-Api-Key"

    auth-whoami:
      forwardAuth:
        address: "http://auth-service:9000/auth?service=whoami"
        authResponseHeaders:
          - "X-Authenticated-Service"
        authRequestHeaders:
          - "X-Api-Key"

    # =========================================================================
    # DASHBOARD — Basic Auth (admin / admin123)
    # =========================================================================
    dashboard-auth:
      basicAuth:
        users:
          - "admin:$apr1$ryhOsEyM$9hkZirMY2bPXz7MfJcGrq1"

    # =========================================================================
    # PATH STRIP PREFIXES — for API services only
    # =========================================================================
    strip-prefix-api1:
      stripPrefix:
        prefixes: ["/api1"]

    strip-prefix-api2:
      stripPrefix:
        prefixes: ["/api2"]

    strip-prefix-web:
      stripPrefix:
        prefixes: ["/web"]

    strip-prefix-whoami:
      stripPrefix:
        prefixes: ["/whoami"]

    # Grafana needs strip-prefix since it handles the /grafana subpath internally
    # via GF_SERVER_ROOT_URL — we strip so it receives requests at /
    strip-prefix-grafana:
      stripPrefix:
        prefixes: ["/grafana"]

    # =========================================================================
    # RATE LIMITING
    # =========================================================================
    rate-limit:
      rateLimit:
        average: 100
        burst: 50

    # =========================================================================
    # SECURITY HEADERS
    # =========================================================================
    secure-headers:
      headers:
        frameDeny: true
        browserXssFilter: true
        contentTypeNosniff: true
